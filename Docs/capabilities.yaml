version: 2
module: SwapFoundationKit
last_reviewed: "2026-08-31"
purpose: >
  Agent-first capability index for host-app feature development. Use this file
  before implementing new UI, utilities, or app infrastructure in a host app.
rules:
  - Check this catalog before building any reusable UI, utility, or infrastructure feature in a host app.
  - Prefer documented public API over copying code from source files.
  - Keep app-specific business rules, domain models, navigation, and flows in the host app.
  - Use SFK directly when the capability is generic and the host app does not need intentional visual or behavioral divergence.
  - If SFK only provides a low-level primitive, keep the higher-level app facade in the host app and place SFK underneath it.
domains:
  - id: theme_tokens
    priority: 1
    module: SwapFoundationKit
    summary: Semantic colors, typography, spacing, radii, motion, and feedback shared by SwiftUI components.
    when_to_check:
      - Defining an application design system
      - Replacing repeated colors, fonts, padding, or corner radii
      - Customizing SFK controls at the app boundary
    prefer_when:
      - The host wants defaults plus focused overrides instead of large visual parameter lists
    keep_in_host_app_when:
      - Brand asset ownership and product-specific visual policy belong to the host
    public_api:
      - SFKTheme
      - SFKTheme.system
      - SFKTheme.accent(_:)
      - View.sfkTheme(_:)
      - EnvironmentValues.sfkTheme
    docs:
      - Sources/SwapFoundationKit/UI/README.md
    examples:
      - Sources/SwapFoundationKit/UI/SFKTheme.swift
    host_app_triggers:
      - design tokens
      - theme
      - typography
      - reusable spacing

  - id: settings
    priority: 1
    summary: Typed settings result-builder with binding/action rows backed by the shared SFKTheme.
    when_to_check:
      - Building a settings page
      - Refactoring app preferences or about screens
      - Adding toggles, pickers, color settings, or destructive settings actions
    prefer_when:
      - The UI is a standard iOS settings form
      - The app wants one shared settings theme across rows and controls
      - The screen mixes app-specific rows with reusable info/developer sections
    keep_in_host_app_when:
      - The app has subscription logic, coordinator routing, or feature gating specific to its product
      - The app intentionally diverges from SFK's settings presentation
    public_api:
      - SFKSettingsScreen
      - SFKSettingsSection
      - SFKSettingsPicker<Value>
      - SFKSettingsPicker<Value>.Presentation
      - SFKSettingsBindingRow
      - SFKSettingsRow
      - SFKSettingsToggle
    migration_notes:
      - "Preferred screen path: SFKSettingsScreen(navigationTitle:content:) with SFKSettingsSection and concrete rows; it does not erase row content."
      - "SFKSettingsPicker uses a Binding<Value>, options, and a Value-to-String label; use SFKSettingsPickerPresentation for subtitle, icon, and tint overrides."
      - "SFKSettingsBindingRow keeps a Binding<Value> and action(Value) concrete; hosts own product-specific navigation and row actions."
    docs:
      - Docs/guides/settings.md
      - Docs/reference/settings-integration-checklist.md
    examples:
      - Sources/SwapFoundationKit/UI/Settings/SFKSettingsScreen.swift
      - SwapFoundationKitHost/SwapFoundationKitHost/SettingsExamplesView.swift
    host_app_triggers:
      - SettingsView
      - SettingsScreen
      - preferences
      - about screen
      - toggle row
      - color picker

  - id: buttons
    priority: 2
    summary: Reusable SFK button components, including standardized close, back, and dismiss patterns.
    when_to_check:
      - Building primary/secondary actions
      - Adding close buttons to sheets or onboarding
      - Adding icon-only back buttons to navigation toolbars
      - Standardizing repeated button styling
    prefer_when:
      - The app needs consistent reusable button styling
      - The interaction pattern is generic rather than feature-specific
    keep_in_host_app_when:
      - The app's design system intentionally diverges from SFK button presentation
      - The button owns product-specific loading or domain logic beyond presentation
    public_api:
      - SFKButton
      - SFKButtonStyle
      - SFKCloseButton
      - SFKCloseButtonChrome
      - SFKGlassMaterial
      - SFKGlassShape
      - View.sfkGlass(material:tint:isInteractive:shape:)
    docs:
      - Docs/migration/migration-guide.md
    examples:
      - Sources/SwapFoundationKit/UI/Buttons/SFKButton.swift
      - Sources/SwapFoundationKit/UI/Buttons/SFKCloseButton.swift
    host_app_triggers:
      - primary button
      - CTA
      - dismiss button
      - close button
      - back button
      - chevron.left
      - glass close button
      - toolbar close button

  - id: text_inputs
    priority: 2
    summary: Reusable single-line and secure text fields with shared styling, validation, focus, accessories, and semantic keyboard configuration.
    when_to_check:
      - Adding a name, email, URL, search, or other text field
      - Building a sign-in, profile, checkout, or data-entry form
      - Adding inline validation or supporting text
      - Standardizing input styling across apps
    prefer_when:
      - The app needs a standard single-line or secure text input
      - The app needs consistent focus, error, success, disabled, and accessibility behavior
    keep_in_host_app_when:
      - The input is a domain-specific editor such as code, rich text, or a multi-line composer
      - The field requires a platform control that cannot be expressed through SwiftUI TextField or SecureField
    public_api:
      - SFKTextField
      - SFKTextFieldStatus
      - SFKTextFieldAppearance
    docs:
      - Sources/SwapFoundationKit/UI/README.md
    examples:
      - Sources/SwapFoundationKit/UI/TextField/SFKTextField.swift
      - SwapFoundationKitHost/SwapFoundationKitHost/TextFieldExamplesView.swift
    host_app_triggers:
      - TextField
      - SecureField
      - email field
      - name field
      - password field
      - form input
      - validation message

  - id: user_feedback
    priority: 2
    summary: Reusable feedback contract, attachment processing, form UI, coordinator, and backend client with host-app configuration seams.
    when_to_check:
      - Adding in-app feedback, bug reporting, or idea submission
      - Sending optional screenshots and user context to a feedback backend
      - Standardizing feedback forms across apps
    prefer_when:
      - The app uses the shared v1 feedback ingestion contract
      - Product-specific analytics and subscription context can be injected
    keep_in_host_app_when:
      - Navigation, analytics event mapping, RevenueCat SDK access, or privacy copy is product-specific
    public_api:
      - SFKFeedbackCoordinator
      - SFKFeedbackConfiguration
      - SFKFeedbackCopy
      - SFKFeedbackUserContextProvider
      - SFKFeedbackUserContext
      - SFKFeedbackInstallationIdentifierStore
    docs:
      - Sources/SwapFoundationKitFeedback/README.md
    examples:
      - Sources/SwapFoundationKitFeedback/SFKFeedbackCoordinator.swift
    host_app_triggers:
      - user feedback
      - send feedback
      - bug report form
      - feedback screenshot

  - id: chips
    priority: 3
    summary: Reusable action and selectable chips with shared sizing and wrapping layouts.
    when_to_check:
      - Adding compact capsule-shaped actions
      - Building selectable chip groups
      - Wrapping tags or chip controls across rows
    prefer_when:
      - The control is semantically a chip rather than a full button
      - The host app needs consistent primary, secondary, or selectable chip treatments
    keep_in_host_app_when:
      - The chip visual intentionally diverges from the shared SFK treatment
    public_api:
      - SFKChip
      - SFKChipStyle
      - SFKChipFlowLayout
      - SFKSelectableChip
      - SFKTheme.Feedback.Style (shared haptic policy)
    docs:
      - Docs/guides/chips.md
    examples:
      - Sources/SwapFoundationKit/UI/Chips/SFKChip.swift
      - Sources/SwapFoundationKit/UI/Onboarding/SFKSelectableChip.swift
    host_app_triggers:
      - chip
      - action chip
      - selectable chip
      - tag cloud

  - id: empty_state
    priority: 3
    summary: Centered empty and error placeholders with optional primary CTA via SFKButton.
    when_to_check:
      - Building list or screen empty states
      - Adding retry or first-action CTAs on blank screens
      - Replacing ContentUnavailableView with branded empty UI
    prefer_when:
      - The empty state is generic (icon, title, message, optional action)
      - The host app only needs to supply copy, symbol, and accent color
    keep_in_host_app_when:
      - The empty state embeds domain-specific charts, previews, or multi-step onboarding
    public_api:
      - SFKEmptyStateView
    docs:
      - Docs/capabilities.yaml
    examples:
      - Sources/SwapFoundationKit/UI/EmptyState/SFKEmptyStateView.swift
      - SwapFoundationKitHost/SwapFoundationKitHost/EmptyStateExamplesView.swift
    host_app_triggers:
      - empty state
      - no data
      - no items yet
      - ContentUnavailableView
      - retry empty screen

  - id: onboarding
    priority: 3
    summary: Reusable progress, typography, and card primitives for multi-step onboarding flows.
    when_to_check:
      - Building multi-step onboarding
      - Adding story-style progress indicators
      - Standardizing onboarding typography or card shells
    prefer_when:
      - The flow needs reusable onboarding primitives rather than a one-off screen
      - The host app wants shared onboarding building blocks but keeps its own state machine
    keep_in_host_app_when:
      - The onboarding is deeply product-specific and only borrows some low-level UI patterns
    public_api:
      - SFKSegmentedProgress
      - SFKTypography
      - SFKCard
    docs:
      - Docs/guides/onboarding.md
    examples:
      - Sources/SwapFoundationKit/UI/Onboarding/SFKSegmentedProgress.swift
    host_app_triggers:
      - onboarding
      - multi-step flow
      - segmented progress

  - id: pickers
    priority: 4
    summary: Generic item picker/list screen and settings pickers for single-select, multi-select, searchable browsing, and row-action flows.
    when_to_check:
      - Building a searchable chooser or modal picker
      - Replacing custom list-based selection sheets
      - Adding option pickers to settings
    prefer_when:
      - The selection model is generic and can conform to SFK protocols
      - The app needs reusable modal picking UI
    keep_in_host_app_when:
      - The picker has feature-specific domain actions or complex filtering logic that must remain app-owned
    public_api:
      - SFKColorPickerSheet
      - SFKColorPickerSheet.Configuration
      - SFKColorPickerSheet.init(selection:configuration:onApply:)
      - SFKItemPickerView
      - SFKItemPickerConfiguration
      - SFKItemPickerView.init(_:items:selection:label:onSelect:)
      - SFKItemPickerView.init(_:items:selections:label:onSelect:)
      - SFKItemPickerView.init(_:items:selection:label:onSelect:) (non-optional selection)
      - SFKPhotoPicker
      - SFKPhotoPicker.init(selection:configuration:onPick:)
      - SFKPickableItem
      - SFKPickableItemIconKind
      - SFKItemPickerToolbarAction
      - SFKItemPickerToolbarAction.Placement
      - SFKItemPickerItemAction
      - SFKItemPickerItemAction.Presentation
    docs:
      - Docs/migration/migration-guide.md
      - Docs/guides/settings.md
    examples:
      - Sources/SwapFoundationKit/UI/ItemPicker/SFKItemPickerView.swift
      - Sources/SwapFoundationKit/UI/PhotoPicker.swift
      - Sources/SwapFoundationKit/UI/Settings/SFKSettingsTypedRows.swift
    migration_notes:
      - "Typed item picker bindings preserve concrete Item values and compare selection by SFKPickableItem.pickableItemId; optional single selection can be cleared by tapping the selected item."
      - "Use concrete bindings and closures on the typed item and color picker APIs; picker delegates and view models are internal implementation details."
      - "PhotoPicker's closure initializer and SFKPhotoPicker update selection on the main actor."
    host_app_triggers:
      - picker
      - color picker sheet
      - selection sheet
      - select item
      - choose currency

  - id: alerts
    priority: 5
    summary: Reusable alert and confirmation presentation helpers.
    when_to_check:
      - Building a generic confirmation dialog
      - Replacing repeated UIKit/SwiftUI alert helpers
      - Adding destructive confirmations in settings or utilities
    prefer_when:
      - The alert is a common reusable prompt pattern
      - The host app wants centralized alert presentation
    keep_in_host_app_when:
      - The app has a custom design-system alert implementation or domain-specific orchestration
    public_api:
      - AlertPresenter
    docs:
      - Docs/migration/migration-guide.md
      - Docs/guides/settings.md
    examples:
      - Sources/SwapFoundationKit/UI/AlertPresenter.swift
    host_app_triggers:
      - alert
      - confirmation
      - destructive action
      - reset dialog

  - id: networking
    priority: 6
    module: SwapFoundationKitNetworking
    summary: Async HTTP requests, typed request/response contracts, downloads, and instance-scoped backend headers.
    when_to_check:
      - Adding an API client or download flow
      - Replacing direct URLSession request code
      - Supplying identity or entitlement headers to a known backend
    prefer_when:
      - The host needs generic HTTP execution and typed request construction
      - Backend-only headers must be restricted to origins configured on the NetworkService instance
    keep_in_host_app_when:
      - The host owns domain routing, authorization policy, or a deliberately different transport
    public_api:
      - HTTPClient
      - NetworkRequest
      - NetworkResponse
      - NetworkDownloadResponse
      - NetworkDownloadProgress
      - NetworkError
      - NetworkService
      - NetworkMonitor
      - NetworkRequest.explicitURL
      - NetworkRequest.usesClientDefaultHeaders
      - NetworkService.init(client:monitor:backendHeadersProvider:backendOrigins:)
    docs:
      - Sources/SwapFoundationKitNetworking/README.md
      - Docs/guides/networking-rfc.md
    examples:
      - Sources/SwapFoundationKitNetworking/Networking.swift
      - Sources/SwapFoundationKitNetworking/NetworkService.swift
    host_app_triggers:
      - HTTP client
      - API client
      - URLSession
      - backend headers
      - backend origin policy

  - id: sync_shared_storage
    module: SwapFoundationKitSync
    priority: 6
    summary: Shared storage, widget sync, and Watch sync primitives for app data propagation.
    when_to_check:
      - Syncing data to widgets, extensions, or watch
      - Replacing app-group file sync code
      - Standardizing cross-target data propagation
    prefer_when:
      - The data is generic and serializable
      - The app wants a reusable sync primitive beneath its domain layer
    keep_in_host_app_when:
      - The host app has domain conflict resolution or orchestration logic that should remain above SFK
    public_api:
      - ItemSync
      - ItemSyncServiceFactory
      - DataSyncService
      - WatchSyncService
      - WatchSyncOptions
      - WatchSyncTransport
    docs:
      - Docs/migration/migration-guide.md
    examples:
      - Sources/SwapFoundationKitSync/ItemSync/ItemSyncServiceFactory.swift
      - Sources/SwapFoundationKitSync/WatchSync/Core/WatchSyncOptions.swift
    host_app_triggers:
      - widget sync
      - app group
      - watch sync
      - shared storage

  - id: utilities
    priority: 7
    summary: Broad utility layer for haptics, logging, analytics, defaults, URLs, backup, file import/export, pasteboard, location, and foundational extensions.
    when_to_check:
      - Adding common app infrastructure
      - Replacing thin wrappers around standard iOS utilities
      - Looking for shared helpers before writing new utility code
    prefer_when:
      - The feature is generic and reusable across multiple apps
      - The host app only needs a thin app-specific facade
    keep_in_host_app_when:
      - The utility owns compliance, billing, auth, or product-specific business logic
    public_api:
      - HapticsHelper
      - Logger
      - AnalyticsManager
      - UserDefault
      - SharedUserDefaults
      - AppLinkOpener
      - BackupService
      - FileExportService
      - FileImportService
      - PasteboardService
      - LocationSearchService
      - Bundle info plist extensions
      - Date extensions
      - String extensions
      - Number extensions
      - URL extensions
      - Debouncer
      - Throttler
      - PersistentTTLStore
    migration_notes:
      - "AnalyticsManager.init() creates an isolated instance. AnalyticsManager.shared remains available only as a legacy convenience; new feature code should inject an instance."
    docs:
      - Sources/SwapFoundationKit/Services/README.md
      - Docs/migration/migration-guide.md
      - Docs/migration/catalog.yaml
    examples:
      - SwapFoundationKitHost/SwapFoundationKitHost/HapticsExamplesView.swift
      - SwapFoundationKitHost/SwapFoundationKitHost/UserDefaultExamplesView.swift
      - SwapFoundationKitHost/SwapFoundationKitHost/AppLinkOpenerExamplesView.swift
    host_app_triggers:
      - haptics
      - logging
      - analytics
      - user defaults
      - app link
      - backup
      - import/export
      - persistent cache
      - ttl store
      - cooldown

  - id: configuration_environment
    priority: 8
    summary: Compile-time environment detection, launch argument parsing, and rounded UIKit appearance configuration.
    when_to_check:
      - Setting up debug/release/testing behavior
      - Parsing CLI flags for UI testing or Maestro automation
      - Configuring global navigation bar and tab bar appearance with rounded typography
      - Wrapping SwiftUI views in a rounded-font hosting controller
    prefer_when:
      - The app needs compile-time environment switching
      - The app uses launch arguments for test automation
      - The app wants a consistent rounded typography system
    keep_in_host_app_when:
      - The app has custom per-environment feature flags beyond basic compile-time detection
      - The app has a custom design system not using rounded fonts
    public_api:
      - SFKAppEnvironment
      - SFKLaunchArguments
      - SFKAppearanceManager
      - UIFont.roundedSystemFont(ofSize:weight:)
      - SFKRoundedHostingController
    docs:
      - Sources/SwapFoundationKit/UI/README.md
    examples:
      - Sources/SwapFoundationKit/Utilities/SFKAppEnvironment.swift
      - Sources/SwapFoundationKit/Utilities/SFKLaunchArguments.swift
      - Sources/SwapFoundationKit/UI/SFKAppearanceManager.swift
      - Sources/SwapFoundationKit/UI/SFKRoundedHostingController.swift
    host_app_triggers:
      - environment
      - launch arguments
      - automation mode
      - rounded font
      - appearance
      - hosting controller

  - id: pulse_inspection
    priority: 8
    module: SwapFoundationKitPulse
    summary: Opt-in Pulse-backed network logging and debug console integration.
    when_to_check:
      - Adding an in-app network inspector
      - Adding a Pulse debug console
      - Capturing HTTPClient requests during development
    prefer_when:
      - The host wants Pulse's existing network store and console UI
      - The host can make an explicit opt-in product dependency
    keep_in_host_app_when:
      - The host intentionally uses another observability or log-viewing backend
    public_api:
      - SFKPulseService
      - SFKPulseConfiguration
      - SFKPulseNetworkCaptureMode
      - SFKPulseStoreLocation
      - SFKPulseConsoleView
      - SFKPulseConsoleMode
    docs:
      - Docs/migration/v4-phase-1-product-extraction.md
      - Sources/SwapFoundationKitPulse/README.md
    examples:
      - Sources/SwapFoundationKitPulse/SFKPulseService.swift
      - Sources/SwapFoundationKitPulse/SFKPulseConsoleView.swift
    host_app_triggers:
      - Pulse
      - PulseUI
      - network inspector
      - debug console

  - id: toast_presentation
    priority: 8
    module: SwapFoundationKitToast
    summary: Opt-in Toast-backed presentation for transient user feedback.
    when_to_check:
      - Adding transient toast notifications
      - Replacing a host-local ToastManager wrapper
    prefer_when:
      - The host can make an explicit opt-in Toast product dependency
    keep_in_host_app_when:
      - The host's design-system toast intentionally diverges from SFK's presentation
    public_api:
      - ToastManager
      - SFKToastKind
      - SFKToastStyle
      - SFKToastConfiguration
    docs:
      - Docs/migration/v4-phase-1-product-extraction.md
      - Sources/SwapFoundationKitToast/README.md
    examples:
      - Sources/SwapFoundationKitToast/ToastManager.swift
    host_app_triggers:
      - toast
      - ToastManager
      - transient notification

  - id: analytics_loggers
    priority: 9
    module: SwapFoundationKitFirebase
    summary: Opt-in AnalyticsLogger adapter with required host-owned Firebase forwarding handlers.
    when_to_check:
      - Adding analytics tracking
      - Wiring up Firebase
      - Implementing AnalyticsLogger protocol
    prefer_when:
      - The app uses Firebase
      - The app wants a drop-in AnalyticsLogger for SFK's AnalyticsManager
    keep_in_host_app_when:
      - The app uses a different analytics provider
      - The app needs custom setup or identification logic per logger
      - The app needs PostHog support (implement a host-side AnalyticsLogger)
    public_api:
      - SFKFirebaseLogger
    docs:
      - Sources/SwapFoundationKitFirebase/README.md
      - Docs/migration/v4-simplification-migration-guide.md
    examples:
      - Sources/SwapFoundationKitFirebase/SFKFirebaseLogger.swift
    host_app_triggers:
      - analytics logger
      - firebase
      - tracking

  - id: pro_gating
    priority: 10
    module: SwapFoundationKit
    summary: Instance-based access gating through an injected SFKAccessPolicy.
    when_to_check:
      - Gating premium features behind in-app purchase
      - Checking Pro status before allowing an action
      - Presenting upsell sheets when a gated feature is accessed
    prefer_when:
      - The app has multiple Pro-gated features
      - The app wants a consistent gating pattern
    keep_in_host_app_when:
      - The app's Pro gating is deeply tied to domain-specific analytics or UI
    public_api:
      - SFKAccessPolicy
      - SFKAccessGate
      - SFKAccessGate.check(_:)
      - SFKAccessGate.require(_:action:)
    docs:
      - Sources/SwapFoundationKit/Services/README.md
    examples:
      - Sources/SwapFoundationKit/Services/SFKAccessPolicy.swift
    migration_notes:
      - "Inject the host's SFKAccessPolicy and upgrade presentation into SFKAccessGate; there is no bootstrap or legacy gate product."
      - "Do not infer entitlement state in SFK; inject the host's policy and upgrade presentation."
    host_app_triggers:
      - pro gate
      - feature gating
      - require pro
      - show pro sheet
      - is pro enabled

  - id: app_attest
    module: SwapFoundationKitAuthentication
    priority: 10
    summary: Reusable App Attest primitives, authenticated installation sessions, and origin-restricted HTTP transport.
    when_to_check:
      - Binding a backend session to a genuine app installation
      - Adding App Attest enrollment or request signing
      - Reusing App Attest across host applications
      - Coordinating enrollment, cached sessions, refresh, and proof binding across apps
    prefer_when:
      - The server owns challenges, identity binding, and authorization policy
      - The host app needs Apple's primitives or the shared challenge/enroll/session/bind client protocol
    keep_in_host_app_when:
      - App-specific authorization policy, identity/proof sources, configuration values, analytics, or UI must remain in a thin host adapter
    public_api:
      - AppAttestService
      - AppAttestProviding
      - AppAttestError
      - AppAttestAttestation
      - AppAttestAssertion
      - AppAttestKeyStore
      - KeychainAppAttestKeyStore
      - AuthenticatedSessionService
      - AuthenticatedSessionConfiguration
      - AuthenticatedSessionBackend
      - AppAttestSessionHTTPBackend
      - SessionBindingProof
      - AuthenticatedHTTPClient
    docs:
      - Sources/SwapFoundationKitAuthentication/README.md
    examples:
      - Sources/SwapFoundationKitAuthentication/AppAttestService.swift
    host_app_triggers:
      - App Attest
      - app attestation
      - device attestation
      - installation identity
      - backend session refresh
      - authenticated transport

  - id: notifications
    priority: 11
    summary: Generic UNUserNotificationCenter wrapper for authorization, posting, scheduling, badge management, and category registration.
    when_to_check:
      - Implementing local notifications
      - Managing notification authorization
      - Scheduling calendar-based reminders
      - Managing app badge count
    prefer_when:
      - The app needs a simple notification API
      - The app wants to avoid direct UNUserNotificationCenter boilerplate
    keep_in_host_app_when:
      - The app has complex notification scheduling tied to domain triggers
    public_api:
      - SFKNotificationService
      - SFKNotificationAction
      - SFKNotificationCategory
    docs:
      - Sources/SwapFoundationKit/Services/README.md
    examples:
      - Sources/SwapFoundationKit/Services/SFKNotificationService.swift
    host_app_triggers:
      - notification
      - push notification
      - local notification
      - badge
      - UNUserNotificationCenter

  - id: image_compression
    module: SwapFoundationKitMedia
    priority: 12
    summary: Media primitives split into image transformation, cache, storage, remote loading, and JPEG compression roles.
    when_to_check:
      - Compressing images for storage or upload
      - Resizing images to a max dimension
      - Reducing image file size for network transfer
    prefer_when:
      - The app needs simple JPEG compression
      - The app wants configurable max dimension and quality
    keep_in_host_app_when:
      - The app needs format-specific compression (PNG, HEIC)
    public_api:
      - ImageProcessor
      - SFKImageTransforming
      - SFKDefaultImageTransformer
      - SFKImageCache
      - SFKMemoryImageCache
      - SFKImageStorage
      - SFKAppGroupImageStorage
      - SFKRemoteImageLoader
      - SFKImageCompressor
      - SFKImageCompressor.compressToSize(_:maxBytes:maxDimension:quality:qualityFloor:)
    migration_notes:
      - "Media responsibilities are separate in SwapFoundationKitMedia; inject only the transformer, cache, storage, loader, or compressor needed by the host."
      - "Remote loading uses an injected ImageProcessorTransport backed by the Networking product; preserve cancellation, status handling, cache keys, and storage paths during migration."
    docs:
      - Sources/SwapFoundationKitMedia/README.md
    examples:
      - Sources/SwapFoundationKitMedia/ImageProcessor/SFKImageCompressor.swift
    host_app_triggers:
      - image compressor
      - compress image
      - resize image
      - jpeg

  - id: async_collections
    priority: 13
    summary: Async extensions for Sequence (asyncReduce) and Dictionary (asyncMap).
    when_to_check:
      - Performing async operations over collections
      - Replacing manual async for-loops with functional patterns
    prefer_when:
      - The app needs sequential async processing over collections
    keep_in_host_app_when:
      - The app needs concurrent processing (TaskGroup-based)
    public_api:
      - asyncReduce(_:_:)
      - asyncMap(_:)
    docs:
      - Sources/SwapFoundationKit/Extensions/README.md
    examples:
      - Sources/SwapFoundationKit/Extensions/Collection+Async.swift
    host_app_triggers:
      - async reduce
      - async map
      - async collection
      - await forEach

  - id: remote_ai
    module: SwapFoundationKitRemoteAI
    priority: 14
    summary: Client for a backend AI generation endpoint — identity headers, snake_case coding, HTTP status to typed error mapping, and cancellation.
    when_to_check:
      - Calling an app backend that returns AI-generated structured content
      - Adding a Pro-gated "generate" or "summarize" feature backed by a worker
      - Replacing a hand-rolled NetworkRequest enum for an AI endpoint
    prefer_when:
      - The model, prompt, and output schema live on the backend, not the client
      - The app only needs to POST a typed request and decode a typed response
    keep_in_host_app_when:
      - Request and response models, which are domain models
      - User-facing error copy, which is product wording and localized per app
    public_api:
      - RemoteAIClient
      - RemoteAIConfiguration
      - RemoteAIError
    docs:
      - Sources/SwapFoundationKitRemoteAI/README.md
    examples:
      - Sources/SwapFoundationKitRemoteAI/RemoteAI/RemoteAIClient.swift
      - Sources/SwapFoundationKitRemoteAI/RemoteAI/RemoteAIConfiguration.swift
    host_app_triggers:
      - ai briefing
      - ai generation
      - generate endpoint
      - llm backend

agent_workflow:
  feature_first_sequence:
    - Read Docs/capabilities.yaml first.
    - Match the host-app request to one or more domains.
    - Read the linked docs/examples for the matched domain before inspecting raw source.
    - Decide one of: use SFK directly, wrap SFK in host-app code, or keep custom host-app code.
    - Only implement custom code first if no documented SFK public API fits.
  output_expectations:
    - State which SFK domain(s) were checked.
    - State which public API was chosen or why SFK was not chosen.
    - If not using SFK, state the reason clearly.
