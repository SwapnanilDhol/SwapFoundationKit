version: 2
module: SwapFoundationKit
last_reviewed: "2026-08-31"
purpose: >
  Source-of-truth inventory for host-app redundancy audits. Use this file before
  the README examples when deciding whether an app-local abstraction should be
  replaced by SwapFoundationKit.
rules:
  - Audit against public API only.
  - Run exact-tier checks first, heuristic-tier checks second, and manual-tier checks last.
  - Prefer false negatives over noisy false positives.
  - Do not flag domain-specific wrappers when SFK only covers the low-level primitive.
capabilities:
  - id: semantic_theme
    audit_tier: exact
    confidence: high
    migration:
      replacement:
        - SFKTheme
        - View.sfkTheme(_:)
      compatibility: canonical
      removal_release: null
    module: SwapFoundationKit
    notes:
      - SFKTheme is the shared environment contract consumed directly by SFK controls and settings rows.
    replace_with:
      - SFKTheme
      - View.sfkTheme(_:)
    public_symbols:
      - SFKTheme.system
      - SFKTheme.accent(_:)
      - EnvironmentValues.sfkTheme
      - View.sfkTheme(_:)
    host_search_terms:
      - SFKSettingsTheme
      - SFKTextFieldAppearance
      - SFKTheme
    suspicious_file_patterns:
      - "*Theme*"
      - "*DesignTokens*"
    keep_custom_when:
      - Host-specific brand assets and semantic roles are not represented by SFK tokens.
    source_files:
      - Sources/SwapFoundationKit/UI/SFKTheme.swift

