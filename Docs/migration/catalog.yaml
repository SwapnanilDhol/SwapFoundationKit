  - id: app_attest
    module: SwapFoundationKitAuthentication
    audit_tier: exact
    confidence: high
    migration:
      replacement:
        - AppAttestService
        - AppAttestProviding
      compatibility: canonical
      removal_release: null
    capability_notes: >-
      AppAttestService hashes server challenge data once and preserves unsupported,
      keyInvalid, transientAppleFailure, and keyStoreFailure errors. keyInvalid is
      stage-dependent. AuthenticatedSessionService coordinates reconciliation and
      bounded recovery for the shared backend protocol; direct primitive callers
      must supply their own equivalent lifecycle.
    replace_with:
      - AppAttestService
      - AppAttestProviding
    public_symbols:
      - AppAttestService.attest(clientData:)
      - AppAttestService.assertion(clientData:)
      - AppAttestService.resetKey()
      - AppAttestError.keyInvalid
      - AppAttestError.transientAppleFailure
    host_search_terms:
      - DCAppAttestService
      - AppAttest
    suspicious_file_patterns:
      - "*AppAttest*"
    keep_custom_when:
      - App-specific authorization policy and identity/proof sources belong to the host; generic session lifecycle and transport belong to SFK.
    source_files:
      - Sources/SwapFoundationKitAuthentication/AppAttestService.swift

  - id: authenticated_sessions
    module: SwapFoundationKitAuthentication
    audit_tier: exact
    confidence: high
    migration:
      replacement:
        - AuthenticatedSessionService
        - AuthenticatedHTTPClient
        - AppAttestSessionHTTPBackend
      compatibility: canonical
      removal_release: null
    capability_notes: >-
      An explicitly configured session actor and HTTP client share enrollment,
      session refresh, proof-binding coordination, per-waiter cancellation,
      secure storage and safe pre-execution retries. No app singleton, vendor
      purchase SDK, entitlement policy or analytics dependency is required.
      The default backend adapter implements the shared App Attest HTTP contract;
      other backends can implement AuthenticatedSessionBackend.
    replace_with:
      - AuthenticatedSessionService
      - AuthenticatedHTTPClient
      - AppAttestSessionHTTPBackend
    public_symbols:
      - AuthenticatedSessionService
      - AuthenticatedSessionConfiguration
      - AuthenticatedSessionBackend
      - AppAttestSessionHTTPBackend
      - SessionBindingProof
      - AuthenticatedHTTPClient
    host_search_terms:
      - BackendSessionService
      - BackendAuthenticatedTransport
      - authenticatedHeaders
      - ensurePurchaseBinding
      - app-attest-enrolled
    suspicious_file_patterns:
      - "*BackendSession*"
      - "*AuthenticatedTransport*"
      - "*BackendAuthStorage*"
    keep_custom_when:
      - The host wrapper only supplies identity/proof adapters, legacy record decoding, configuration, route policy, analytics or UI.
    source_files:
      - Sources/SwapFoundationKitAuthentication/Authentication/AuthenticatedSessionService.swift
      - Sources/SwapFoundationKitAuthentication/Authentication/AppAttestSessionHTTPBackend.swift
      - Sources/SwapFoundationKitAuthentication/Authentication/AuthenticatedHTTPClient.swift

